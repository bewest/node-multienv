apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-migration-config
  namespace: hosted-tenants
  labels:
    ns.mdn.io/enabled: "true"
    ns.mdn.io/tier: "basic"
    ns.mdn.io/migration-from: "legacy"
  annotations:
    ns.mdn.io/legacy-configmap: "default/tenant-demo-legacy"
    ns.mdn.io/migration-date: "2025-10-25"
data:
  TENANT_ID: "demo"
  NS_IMAGE: "nightscout/cgm-remote-monitor:latest"
  MONGO_IMAGE: "mongo:6"
  MONGO_STORAGE_GI: "10"
  MONGO_SC: "standard"
  MONGO_REPLICAS: "1"
  NS_REPLICAS: "2"
  
  CDC_ENABLED: "true"
  CDC_COLLECTIONS: "entries,treatments"
  CDC_PARTITIONS_ENTRIES: "3"
  CDC_PARTITIONS_TREATMENTS: "1"
  KAFKA_CLUSTER_NAME: "kafka-cluster"
  KAFKA_CONNECT_CLUSTER_NAME: "connect-cluster"
  
  MIGRATION_ENABLED: "true"
  MIGRATION_SOURCE_URI: "mongodb://legacy-cluster.default.svc:27017/tenant-demo"
  MIGRATION_SOURCE_SECRET: "legacy-mongo-creds"
  MIGRATION_METHOD: "mongodump-restore"
  MIGRATION_IMAGE: "mongo:6"

---
apiVersion: v1
kind: Secret
metadata:
  name: legacy-mongo-creds
  namespace: hosted-tenants
type: Opaque
stringData:
  uri: "mongodb://admin:password@legacy-cluster.default.svc:27017/tenant-demo?authSource=admin"
