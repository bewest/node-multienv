apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: hosted-tenants
  labels:
    ns.mdn.io/enabled: "true"
    ns.mdn.io/tier: "basic"
    ns.mdn.io/migration-from: "legacy"
  annotations:
    ns.mdn.io/legacy-configmap: "default/tenant-demo-legacy"
    ns.mdn.io/migration-date: "2025-10-25"
data:
  TENANT_ID: "demo"
  NS_IMAGE: "nightscout/cgm-remote-monitor:latest"
  MONGO_IMAGE: "mongo:6"
  MONGO_STORAGE_GI: "10"
  MONGO_SC: "standard"
  MONGO_REPLICAS: "1"
  NS_REPLICAS: "2"
  CDC_ENABLED: "true"
  CDC_COLLECTIONS: "entries,treatments"
  CDC_PARTITIONS_ENTRIES: "3"
  CDC_PARTITIONS_TREATMENTS: "1"
  KAFKA_CLUSTER_NAME: "kafka-cluster"
  KAFKA_CONNECT_CLUSTER_NAME: "connect-cluster"
