apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-demo-config
  namespace: hosted-tenants
  labels:
    ns.mdn.io/enabled: "true"
data:
  # Tenant Identity
  TENANT_ID: "demo"
  
  # Nightscout Configuration
  NS_IMAGE: "nightscout/cgm-remote-monitor:latest"
  NS_REPLICAS: "1"
  NS_SERVICE_TYPE: "ClusterIP"
  NS_CPU_REQUEST: "100m"
  NS_CPU_LIMIT: "500m"
  NS_MEM_REQUEST: "256Mi"
  NS_MEM_LIMIT: "512Mi"
  NS_PDB_MIN_AVAILABLE: "1"
  
  # MongoDB Configuration
  MONGO_IMAGE: "mongo:6"
  MONGO_REPLICAS: "1"
  MONGO_STORAGE_GI: "10"
  MONGO_SC: "standard"
  MONGO_CPU_REQUEST: "100m"
  MONGO_CPU_LIMIT: "500m"
  MONGO_MEM_REQUEST: "256Mi"
  MONGO_MEM_LIMIT: "512Mi"
  MONGO_PDB_MIN_AVAILABLE: "1"
  
  # CDC/Kafka Configuration
  CDC_ENABLED: "true"
  CDC_COLLECTIONS: "entries,treatments"
  CDC_PARTITIONS_ENTRIES: "3"
  CDC_PARTITIONS_TREATMENTS: "1"
  CDC_RETENTION_MS: "604800000"  # 7 days
  CDC_TASKS_MAX: "1"
  KAFKA_CLUSTER_NAME: "kafka-cluster"
  KAFKA_CONNECT_CLUSTER_NAME: "connect-cluster"
  KAFKA_TOPIC_REPLICAS: "3"
  
  # Backup Configuration (via annotations on PVC)
  # To override snapshot class, add annotation to PVC:
  # ns.mdn.io/backup-snapshot-class: "your-snapshot-class"
