# Storage Composite Example
# Creates a dedicated MongoDB StatefulSet for a storage account
#
# This Secret is the parent resource for the storage composite controller.
# The controller will create:
#   - MongoDB StatefulSet
#   - MongoDB Service  
#   - Related: PVC (via volumeClaimTemplate, protected from deletion)

apiVersion: v1
kind: Secret
metadata:
  name: storage-demo-account
  namespace: hosted-tenants
  labels:
    # Required: Triggers storage composite controller
    ns.mdn.io/composite: storage
    # Storage account identifier (used by compute composite to find this Secret)
    storage.nightscout.org/account: demo-account
    # Optional: Tier for resource sizing
    ns.mdn.io/tier: basic
  annotations:
    ns.mdn.io/storage-type: dedicated
    ns.mdn.io/created-at: "2025-01-15T00:00:00Z"
type: Opaque
stringData:
  # MongoDB configuration
  replicas: "1"
  storageGi: "2"
  mongoImage: "mongo:6"
  imagePullPolicy: "IfNotPresent"
  
  # Resource limits
  cpuRequest: "100m"
  cpuLimit: "500m"
  memRequest: "256Mi"
  memLimit: "512Mi"
  
  # MongoDB credentials (generated by storage controller if not provided)
  username: "nsuser"
  password: "change-me-random-password"
  database: "nightscout"

---
# Storage Composite Example - Shared MongoDB
# Points to a shared MongoDB cluster instead of creating dedicated StatefulSet
#
# Use this for existing 1300 sites during migration

apiVersion: v1
kind: Secret
metadata:
  name: storage-shared-mongodb
  namespace: hosted-tenants
  labels:
    ns.mdn.io/composite: storage
    storage.nightscout.org/account: shared-cluster
  annotations:
    ns.mdn.io/storage-type: shared
    ns.mdn.io/created-at: "2025-01-15T00:00:00Z"
type: Opaque
stringData:
  # For shared MongoDB, just provide connection details
  # No StatefulSet will be created
  mongoHost: "shared-mongodb.database.svc.cluster.local"
  username: "shared-user"
  password: "shared-password"
  database: "nightscout"
