apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nightscouttenants.nightscout.io
spec:
  group: nightscout.io
  names:
    kind: NightscoutTenant
    plural: nightscouttenants
    singular: nightscouттenant
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
            - metadata
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioned
                    - Ready
                    - Error
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
            spec:
              type: object
              required:
                - pvcName
                - mongoAuthSecretRef
              properties:
                # Phase 1 (Provisioner creates)
                pvcName:
                  type: string
                  description: |
                    Name of PVC for MongoDB data (e.g., data-{tenantId}-0)
                    Referenced by spec, not owned by controller
                
                mongoAuthSecretRef:
                  type: object
                  required:
                    - name
                  description: |
                    Reference to mongo-auth Secret with admin credentials
                    Created by provisioner, decorator-protected (blast radius protection)
                  properties:
                    name:
                      type: string
                      description: Name of mongo-auth Secret
                    namespace:
                      type: string
                      description: Namespace of mongo-auth Secret (default to CR namespace)
                
                # Phase 2 (ConfigMap activates compute)
                configMapRef:
                  type: object
                  description: |
                    Optional reference to provisioner-managed ConfigMap for tenant userdata
                    ConfigMap presence enables compute layer (ReplicaSet renders)
                    Missing/deleted ConfigMap = storage-only mode (no pods)
                    Deleting ConfigMap via environs API stops tenant execution
                  properties:
                    name:
                      type: string
                      description: Name of ConfigMap (for migration/adoption)
                    namespace:
                      type: string
                      description: Namespace of ConfigMap (default to CR namespace)
                
                # Gen3/Gen4 migration support
                initialStorageType:
                  type: string
                  enum:
                    - shared
                    - dedicated
                  default: dedicated
                  description: |
                    Storage type for Gen3/Gen4 migration compatibility
                    Sets ns.mdn.io/runtime-required annotation on CR
