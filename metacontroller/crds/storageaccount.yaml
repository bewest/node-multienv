apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: storageaccounts.nightscout.io
spec:
  group: nightscout.io
  names:
    kind: StorageAccount
    plural: storageaccounts
    singular: storageaccount
    shortNames:
      - sa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
            - metadata
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - selector
              properties:
                selector:
                  type: object
                  description: Label selector for resources managed by this StorageAccount
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: Map of label key-value pairs that must match
                    matchExpressions:
                      type: array
                      description: List of label selector requirements
                      items:
                        type: object
                        required:
                          - key
                          - operator
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            items:
                              type: string
                storageType:
                  type: string
                  enum: [dedicated, shared]
                  default: dedicated
                  description: Type of storage - dedicated creates new MongoDB, shared uses existing
                mongodbVersion:
                  type: string
                  description: MongoDB version to deploy
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  description: Number of MongoDB replica set members
                tier:
                  type: string
                  description: Tenant tier for resource allocation (references ConfigMap)
                storageSize:
                  type: string
                  description: PVC storage size (e.g., 10Gi)
                resources:
                  type: object
                  description: MongoDB pod resource requests/limits
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                backup:
                  type: object
                  description: Backup configuration for PVCs
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    schedule:
                      type: string
                    retentionPolicy:
                      type: string
                migration:
                  type: object
                  description: Migration configuration
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    sourceMongoUri:
                      type: string
                sharedConnection:
                  type: object
                  description: Connection details for shared storage mode
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  description: Generation observed by controller
                phase:
                  type: string
                  description: Current phase (Pending, Provisioning, Ready, Failed)
                conditions:
                  type: array
                  description: Kubernetes-standard status conditions
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: [True, False, Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                connectionSecret:
                  type: string
                  description: Name of Secret containing MongoDB credentials
                databaseName:
                  type: string
                  description: Generated database name for this storage account
                endpoints:
                  type: object
                  description: MongoDB connection endpoints
                  properties:
                    primary:
                      type: string
                    replicas:
                      type: array
                      items:
                        type: string
                orphanedResources:
                  type: array
                  description: Resources matching selector but not owned by this StorageAccount
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
