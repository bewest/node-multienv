
apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: migration-controller
spec:
  generateSelector: true
  parentResource:
    apiVersion: nightscout.k8s/v1alpha1
    resource: tenantmigrations
    scope: Namespaced
  childResources:
    - apiVersion: batch/v1
      resource: jobs
  hooks:
    sync:
      webhook:
        url: http://deployment-controller:3000/metacontroller/migration/sync
