apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: nightscout-controller
  annotations:
    metacontroller.k8s.io/description: |
      Manages Nightscout instances using related resources pattern:
      - Secrets: MongoDB credentials
      - ConfigMaps: Nightscout configuration
      - StatefulSet: MongoDB database
      - Deployment: Nightscout application
      - Jobs: Database initialization and migrations
spec:
  generateSelector: true
  parentResource:
    apiVersion: nightscout.k8s/v1alpha1
    resource: nightscoutinstances
    # scope: Namespaced
  childResources:
    - apiVersion: batch/v1
      resource: jobs
    - apiVersion: apps/v1
      resource: deployments
      updateStrategy:
        method: InPlace
    - apiVersion: v1
      resource: services
    - apiVersion: v1
      resource: secrets
    - apiVersion: v1
      resource: configmaps 
  hooks:
    sync:
      webhook:
        url: http://multienv-deployment-controller:3000/metacontroller/sync
    customize:
      webhook:
        url: http://multienv-deployment-controller:3000/metacontroller/customize
