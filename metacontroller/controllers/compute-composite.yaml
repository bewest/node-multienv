apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: compute-composite
  annotations:
    metacontroller.k8s.io/description: |
      Compute Composite Controller
      
      Manages Nightscout Deployment + Service from ConfigMap parent.
      Discovers storage Secret and MongoDB StatefulSet via related resources.
      
      Parent: ConfigMap (ns.mdn.io/composite=compute)
      Children: Deployment, Service, PodDisruptionBudget
      Related: Secret (storage credentials), StatefulSet (MongoDB - blast radius protection)
      
      Design: Separates compute configuration (ConfigMap) from storage (Secret).
      Compute has no visibility to storage credentials (environs API safety).
      If ConfigMap deleted → Deployment deleted, but storage survives.
spec:
  generateSelector: true
  
  parentResource:
    apiVersion: v1
    resource: configmaps
    labelSelector:
      matchLabels:
        ns.mdn.io/composite: compute
  
  childResources:
    - apiVersion: apps/v1
      resource: deployments
      updateStrategy:
        method: InPlace
    - apiVersion: v1
      resource: services
    - apiVersion: policy/v1
      resource: poddisruptionbudgets
    - apiVersion: batch/v1
      resource: jobs
      # Migration and init jobs
    - apiVersion: kafka.strimzi.io/v1beta2
      resource: kafkatopics
      # Optional CDC topics
    - apiVersion: kafka.strimzi.io/v1beta2
      resource: kafkaconnectors
      # Optional CDC connectors
  
  relatedResources:
    # Storage Secret - provides MongoDB credentials (discovered, not owned)
    - apiVersion: v1
      resource: secrets
      labelSelector:
        matchExpressions:
          - key: storage.nightscout.org/account
            operator: Exists
          - key: ns.mdn.io/composite
            operator: In
            values: ["storage"]
    
    # MongoDB StatefulSet - blast radius protection
    # If ConfigMap deleted → Deployment gone, but MongoDB survives
    - apiVersion: apps/v1
      resource: statefulsets
      labelSelector:
        matchExpressions:
          - key: storage.nightscout.org/account
            operator: Exists
          - key: app.kubernetes.io/name
            operator: In
            values: ["mongodb"]
  
  hooks:
    sync:
      webhook:
        url: http://webhook-server:3000/composite/compute/sync
        timeout: 30s
