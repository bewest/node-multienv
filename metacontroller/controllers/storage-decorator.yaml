
apiVersion: metacontroller.k8s.io/v1alpha1
kind: DecoratorController
metadata:
  name: storage-decorator
spec:
  resources:
    - apiVersion: v1
      resource: secrets
      labelSelector:
        matchExpressions:
          - key: "storage.nightscout.org/account"
            operator: "Exists"
  attachments:
    - apiVersion: v1
      resource: persistentvolumeclaims
      updateStrategy:
        method: OnDelete
  hooks:
    sync:
      webhook:
        url: http://multienv-deployment-controller:3000/metacontroller/storage/sync
    customize:
      webhook:
        url: http://multienv-deployment-controller:3000/metacontroller/storage/customize
    finalize:
      webhook:
        url: http://multienv-deployment-controller:3000/metacontroller/storage/sync
