openapi: 3.0.3
info:
  title: Nightscout Metacontroller Webhooks (Generation 4) - Declarative Kubernetes Orchestration
  version: 4.0.0
  description: |
    Generation 4 of the Nightscout hosting platform. This implementation uses Metacontroller webhooks
    for fully declarative, Kubernetes-native orchestration. No REST API - pure webhook-based control plane.
    
    **Key Characteristics:**
    - Declarative webhook-based orchestration (no imperative REST API)
    - CompositeController for tenant lifecycle management
    - DecoratorController for PVC backup policies
    - Kubernetes-idiomatic status conditions
    - Full audit trail via labels and annotations
    
    **Architecture:**
    - `cmd/webhook/server.js`: Express server handling webhook requests
    - `handlers/composite-sync.js`: Creates 11-12 Kubernetes resources per tenant
    - `handlers/decorator-sync.js`: Adds backup policies to PVCs
    - Metacontroller watches ConfigMaps, calls webhooks
    - Zero REST API - pure Kubernetes control plane
    
    **Components Created Per Tenant:**
    1. Secret (MongoDB credentials)
    2. Service (MongoDB headless service)
    3. StatefulSet (MongoDB replica set)
    4. PodDisruptionBudget (MongoDB availability)
    5. Service (Nightscout service)
    6. Deployment (Nightscout application)
    7. PodDisruptionBudget (Nightscout availability)
    8. KafkaTopic (CDC events)
    9. KafkaConnector (MongoDB CDC)
    10. Job (optional migration)
    11. VolumeSnapshot (on PVC deletion via decorator)
    
    **Use Cases:**
    - Production Kubernetes clusters
    - GitOps workflows
    - Declarative infrastructure
    - Multi-tenant SaaS platforms
    - Full lifecycle automation
  contact:
    email: bewest@gmail.com
  license:
    name: Affero GPL 3.0

servers:
  - url: 'http://localhost:3000'
    description: Local webhook server
  - url: 'http://webhook-server.hosted-tenants.svc.cluster.local:3000'
    description: Kubernetes service endpoint

tags:
  - name: composite
    description: Composite controller webhooks (tenant orchestration)
  - name: decorator
    description: Decorator controller webhooks (PVC backup policies)
  - name: health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Returns server health status
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

  /composite/sync:
    post:
      tags:
        - composite
      summary: Composite controller sync webhook
      description: |
        Called by Metacontroller to synchronize desired state.
        
        **Trigger:** ConfigMap with label `ns.mdn.io/enabled: "true"` created/updated
        
        **Creates:**
        - MongoDB Secret, Service, StatefulSet, PodDisruptionBudget
        - Nightscout Service, Deployment, PodDisruptionBudget
        - KafkaTopic, KafkaConnector (if CDC enabled)
        - Job (if migration enabled)
        
        **Status Conditions:**
        - MongoDBReady: MongoDB StatefulSet ready
        - MigrationComplete: Database migration finished
        - CDCReady: Kafka connector operational
        - Ready: Overall tenant readiness
      operationId: compositeSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeSyncRequest'
      responses:
        '200':
          description: Sync successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeSyncResponse'
              example:
                status:
                  conditions:
                    - type: "MongoDBReady"
                      status: "True"
                      reason: "StatefulSetReady"
                      message: "MongoDB StatefulSet has 1/1 replicas ready"
                    - type: "MigrationComplete"
                      status: "True"
                      reason: "JobCompleted"
                      message: "Migration job completed successfully"
                    - type: "CDCReady"
                      status: "True"
                      reason: "ConnectorRunning"
                      message: "Kafka connector is running"
                    - type: "Ready"
                      status: "True"
                      reason: "AllComponentsReady"
                      message: "Tenant is fully operational"
                children:
                  - apiVersion: "v1"
                    kind: "Secret"
                    metadata:
                      name: "demo-mongo-credentials"
                  - apiVersion: "apps/v1"
                    kind: "StatefulSet"
                    metadata:
                      name: "demo-mongo"
                  - apiVersion: "apps/v1"
                    kind: "Deployment"
                    metadata:
                      name: "demo-nightscout"

  /composite/finalize:
    post:
      tags:
        - composite
      summary: Composite controller finalize webhook
      description: |
        Called by Metacontroller when parent ConfigMap is being deleted.
        
        **Actions:**
        - Ensures child resources are properly cleaned up
        - Can perform pre-deletion operations (backups, notifications)
        - Returns whether finalization is complete
      operationId: compositeFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeFinalizeRequest'
      responses:
        '200':
          description: Finalization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeFinalizeResponse'
              example:
                finalized: true
                status:
                  conditions:
                    - type: "Ready"
                      status: "False"
                      reason: "Terminating"
                      message: "Tenant is being terminated"

  /decorator/sync:
    post:
      tags:
        - decorator
      summary: Decorator controller sync webhook
      description: |
        Called by Metacontroller to add backup policies to PVCs.
        
        **Trigger:** PVC created that matches labelSelector
        
        **Actions:**
        - Adds finalizer to prevent immediate deletion
        - Adds annotations:
          - `ns.mdn.io/backup-schedule`: When to take backups
          - `ns.mdn.io/backup-retention`: How long to keep backups
          - `ns.mdn.io/tenant-email`: Owner contact info
        - Preserves existing annotations from other operators
      operationId: decoratorSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecoratorSyncRequest'
      responses:
        '200':
          description: Decorator sync successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecoratorSyncResponse'
              example:
                status: {}
                attachments:
                  - apiVersion: "v1"
                    kind: "PersistentVolumeClaim"
                    metadata:
                      name: "data-demo-mongo-0"
                      finalizers:
                        - "ns.mdn.io/backup-finalizer"
                      annotations:
                        ns.mdn.io/backup-schedule: "daily"
                        ns.mdn.io/backup-retention: "30d"
                        ns.mdn.io/tenant-email: "admin@example.com"

  /decorator/finalize:
    post:
      tags:
        - decorator
      summary: Decorator controller finalize webhook
      description: |
        Called by Metacontroller when PVC is being deleted.
        
        **Actions:**
        - Creates VolumeSnapshot before PVC deletion
        - Snapshot includes labels for data recovery:
          - `ns.mdn.io/tenant-id`: Tenant identifier
          - `ns.mdn.io/backup-type`: "pre-deletion"
          - `ns.mdn.io/source-pvc`: Original PVC name
        - Returns finalized=true when snapshot is created
      operationId: decoratorFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecoratorFinalizeRequest'
      responses:
        '200':
          description: Finalization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecoratorFinalizeResponse'
              example:
                finalized: true
                attachments:
                  - apiVersion: "snapshot.storage.k8s.io/v1"
                    kind: "VolumeSnapshot"
                    metadata:
                      name: "demo-mongo-final-snapshot-1234567890"
                      labels:
                        ns.mdn.io/tenant-id: "demo"
                        ns.mdn.io/backup-type: "pre-deletion"
                        ns.mdn.io/source-pvc: "data-demo-mongo-0"

components:
  schemas:
    CompositeSyncRequest:
      type: object
      description: Metacontroller CompositeController sync request
      required:
        - parent
        - children
      properties:
        parent:
          $ref: '#/components/schemas/ConfigMapParent'
        children:
          type: object
          description: Existing child resources grouped by API group/kind
          additionalProperties:
            type: object
          example:
            Secret.v1:
              demo-mongo-credentials:
                apiVersion: "v1"
                kind: "Secret"
                metadata:
                  name: "demo-mongo-credentials"
            StatefulSet.apps/v1:
              demo-mongo:
                apiVersion: "apps/v1"
                kind: "StatefulSet"
                metadata:
                  name: "demo-mongo"
                status:
                  readyReplicas: 1
                  replicas: 1
        finalizing:
          type: boolean
          description: Whether parent is being deleted
          example: false

    CompositeSyncResponse:
      type: object
      description: Metacontroller CompositeController sync response
      properties:
        status:
          type: object
          description: Status to write to parent ConfigMap
          properties:
            conditions:
              type: array
              items:
                $ref: '#/components/schemas/Condition'
            observedGeneration:
              type: integer
            tenantId:
              type: string
            mongoReplicas:
              type: integer
            nsReplicas:
              type: integer
        children:
          type: array
          description: Desired child resources to create/update
          items:
            type: object
            description: Kubernetes resource manifest
        resyncAfterSeconds:
          type: number
          description: How soon to call sync again
          example: 60

    CompositeFinalizeRequest:
      type: object
      required:
        - parent
        - children
      properties:
        parent:
          $ref: '#/components/schemas/ConfigMapParent'
        children:
          type: object
          description: Existing child resources
        finalizing:
          type: boolean
          example: true

    CompositeFinalizeResponse:
      type: object
      properties:
        finalized:
          type: boolean
          description: Whether finalization is complete
          example: true
        status:
          type: object
          description: Final status to write
          properties:
            conditions:
              type: array
              items:
                $ref: '#/components/schemas/Condition'

    DecoratorSyncRequest:
      type: object
      description: Metacontroller DecoratorController sync request
      required:
        - object
      properties:
        object:
          type: object
          description: The PVC being decorated
          properties:
            apiVersion:
              type: string
              example: "v1"
            kind:
              type: string
              example: "PersistentVolumeClaim"
            metadata:
              type: object
              properties:
                name:
                  type: string
                namespace:
                  type: string
                labels:
                  type: object
                annotations:
                  type: object
            spec:
              type: object
            status:
              type: object
        attachments:
          type: object
          description: Existing decorator attachments
        finalizing:
          type: boolean

    DecoratorSyncResponse:
      type: object
      properties:
        status:
          type: object
          description: Status to write to decorated object
        attachments:
          type: array
          description: Modified version of the decorated object
          items:
            type: object
        labels:
          type: object
          description: Labels to add/update
        annotations:
          type: object
          description: Annotations to add/update
        finalizers:
          type: array
          description: Finalizers to add
          items:
            type: string

    DecoratorFinalizeRequest:
      type: object
      required:
        - object
      properties:
        object:
          type: object
          description: The PVC being deleted
        attachments:
          type: object
        finalizing:
          type: boolean
          example: true

    DecoratorFinalizeResponse:
      type: object
      properties:
        finalized:
          type: boolean
          description: Whether finalization is complete
          example: true
        attachments:
          type: array
          description: Resources to create (e.g., VolumeSnapshot)
          items:
            type: object

    ConfigMapParent:
      type: object
      description: Parent ConfigMap that triggers tenant creation
      properties:
        apiVersion:
          type: string
          example: "v1"
        kind:
          type: string
          example: "ConfigMap"
        metadata:
          type: object
          properties:
            name:
              type: string
            namespace:
              type: string
            labels:
              type: object
              properties:
                ns.mdn.io/enabled:
                  type: string
                  example: "true"
                ns.mdn.io/tier:
                  type: string
                  example: "premium"
            annotations:
              type: object
              properties:
                ns.mdn.io/tenant-email:
                  type: string
                ns.mdn.io/created-at:
                  type: string
        data:
          type: object
          description: Tenant configuration parameters
          additionalProperties:
            type: string
          example:
            TENANT_ID: "demo"
            MONGO_IMAGE: "mongo:6"
            NS_IMAGE: "nightscout/cgm-remote-monitor:latest"
            MONGO_REPLICAS: "1"
            MONGO_STORAGE_GI: "10"
            MIGRATION_ENABLED: "true"
        status:
          type: object
          description: Tenant status (written by webhook)
          properties:
            conditions:
              type: array
              items:
                $ref: '#/components/schemas/Condition'

    Condition:
      type: object
      description: Kubernetes status condition
      required:
        - type
        - status
      properties:
        type:
          type: string
          description: Condition type
          enum: [MongoDBReady, MigrationComplete, CDCReady, Ready]
          example: "Ready"
        status:
          type: string
          enum: ["True", "False", "Unknown"]
          example: "True"
        reason:
          type: string
          description: Machine-readable reason code
          example: "AllComponentsReady"
        message:
          type: string
          description: Human-readable message
          example: "Tenant is fully operational"
        lastTransitionTime:
          type: string
          format: date-time
          description: When condition last changed
        lastUpdateTime:
          type: string
          format: date-time
          description: When condition was last updated

externalDocs:
  description: Metacontroller Documentation
  url: https://metacontroller.github.io/metacontroller/

x-generation: 4
x-implementation: metacontroller-webhooks
x-metacontroller-config:
  CompositeController:
    apiVersion: metacontroller.k8s.io/v1alpha1
    kind: CompositeController
    metadata:
      name: nightscout-tenant-controller
    spec:
      parentResource:
        apiVersion: v1
        resource: configmaps
        labelSelector:
          matchLabels:
            ns.mdn.io/enabled: "true"
      childResources:
        - apiVersion: v1
          resource: secrets
        - apiVersion: v1
          resource: services
        - apiVersion: apps/v1
          resource: statefulsets
        - apiVersion: apps/v1
          resource: deployments
        - apiVersion: policy/v1
          resource: poddisruptionbudgets
        - apiVersion: kafka.strimzi.io/v1beta2
          resource: kafkatopics
        - apiVersion: kafka.strimzi.io/v1beta2
          resource: kafkaconnectors
        - apiVersion: batch/v1
          resource: jobs
      hooks:
        sync:
          webhook:
            url: http://webhook-server.hosted-tenants.svc.cluster.local:3000/composite/sync
        finalize:
          webhook:
            url: http://webhook-server.hosted-tenants.svc.cluster.local:3000/composite/finalize

  DecoratorController:
    apiVersion: metacontroller.k8s.io/v1alpha1
    kind: DecoratorController
    metadata:
      name: pvc-backup-decorator
    spec:
      resources:
        - apiVersion: v1
          resource: persistentvolumeclaims
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: database
      attachments:
        - apiVersion: v1
          resource: persistentvolumeclaims
      hooks:
        sync:
          webhook:
            url: http://webhook-server.hosted-tenants.svc.cluster.local:3000/decorator/sync
        finalize:
          webhook:
            url: http://webhook-server.hosted-tenants.svc.cluster.local:3000/decorator/finalize

x-workflow:
  description: |
    **Tenant Creation:**
    1. User creates ConfigMap with label `ns.mdn.io/enabled: "true"`
    2. Metacontroller detects ConfigMap, calls /composite/sync
    3. Webhook returns 11-12 child resources
    4. Metacontroller creates/updates children
    5. Webhook updates ConfigMap status with conditions
    6. Tenant becomes Ready when all components healthy
    
    **PVC Backup:**
    1. MongoDB StatefulSet creates PVC
    2. Metacontroller calls /decorator/sync
    3. Webhook adds finalizer + backup annotations
    4. User deletes ConfigMap (tenant deletion)
    5. Metacontroller calls /decorator/finalize
    6. Webhook creates VolumeSnapshot
    7. PVC is deleted after snapshot completes
    
x-migration:
  from-gen3:
    - Remove deployment controller REST API
    - Remove dispatcher (Metacontroller watches ConfigMaps)
    - Add Metacontroller CRDs
    - Deploy webhook server
    - ConfigMaps trigger webhooks automatically
  benefits:
    - Declarative (no imperative REST calls)
    - GitOps friendly
    - Kubernetes-native control loop
    - Automatic reconciliation
    - Standard status conditions
